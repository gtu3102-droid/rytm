<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="theme-color" content="#111A28">

<title>رتم | Rhythm</title>
<link rel="icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#EDF3F6;--bg2:#E6EFF4;--card:#FFFFFF;--ink:#13202F;--mut:#52687D;--line:#D5E1E8;--nav:#111A28;--navtx:#D3E2EC;--navmut:#8EA5B9;--navon:#33D1BC;--navonink:#0C1B26;--g:#0A8277;--b:#1B78A8;--a:#B85C0B;--r:#C8333F;--in:#F7FAFC;--onc:#fff;--warnbg:#B85C0B22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0E1420;--bg2:#09101A;--card:#162030;--ink:#E9EFF4;--mut:#9AAEC0;--line:#253449;--nav:#0A101A;--navtx:#C8D8E4;--navmut:#8499AD;--navon:#33D1BC;--navonink:#0A1620;--g:#2FC7B3;--b:#4DB5E6;--a:#FF9A55;--r:#FF6B6B;--in:#101A29;--onc:#0A1620;--warnbg:#FF9A5524}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E1420;--bg2:#09101A;--card:#162030;--ink:#E9EFF4;--mut:#9AAEC0;--line:#253449;--nav:#0A101A;--navtx:#C8D8E4;--navmut:#8499AD;--navon:#33D1BC;--navonink:#0A1620;--g:#2FC7B3;--b:#4DB5E6;--a:#FF9A55;--r:#FF6B6B;--in:#101A29;--onc:#0A1620;--warnbg:#FF9A5524}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
html{-webkit-text-size-adjust:100%}
body{overflow-wrap:break-word;margin:0;background:var(--bg);background-image:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--ink);font:15px/1.6 Tajawal,system-ui,sans-serif}
.app{display:flex;min-height:100vh;min-height:100dvh}
aside{width:250px;flex:none;background:var(--nav);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;color:#fff}
aside h1{font-size:21px;margin:0;font-weight:800;padding:0 12px}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:4px 6px 16px}.brand img{width:168px;height:auto;display:block;filter:drop-shadow(0 4px 16px #0007)}.brand h1{padding:0;font-size:30px;line-height:1.1}.brand small{padding:0;margin:0}
aside small{display:block;color:var(--navmut);padding:0 12px 16px;font-size:12px}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--navtx);text-decoration:none;cursor:pointer;border:0;background:none;font:inherit;text-align:start;width:100%}
.nv:hover{background:#ffffff14}.nv.on{background:var(--navon);color:var(--navonink);font-weight:700}
.nv span{width:22px;text-align:center}
.foot{margin-top:auto;font-size:12px;color:var(--navmut);padding:10px 12px;line-height:1.7}
main{flex:1;min-width:0;padding:28px;max-width:1120px;width:100%;margin-inline:auto}
em.lbl{font-style:normal}.mtop{display:none}
h2.t{font-size:27px;font-weight:800;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h3{margin:0 0 10px;font-size:16px;font-weight:700}
.kv{font-size:30px;font-weight:800;line-height:1.2}.lb{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
input[type=checkbox],input[type=radio]{width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:110px}
button.btn{font:inherit;font-weight:700;background:linear-gradient(135deg,var(--g),var(--b));color:var(--onc);border:0;border-radius:9px;padding:9px 16px;cursor:pointer;margin-top:10px}
button.btn.b{background:var(--b)}button.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}button.btn.s{padding:3px 10px;margin:0;font-size:12px}
.pill{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;cursor:pointer}.pill.on{background:linear-gradient(135deg,var(--g),var(--b));color:var(--onc);border-color:transparent}
.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.chart{display:flex;gap:10px;align-items:flex-end;height:130px;margin-top:8px}.col{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bs{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:105px}.bs i{width:30%;max-width:16px;border-radius:4px 4px 0 0;min-height:2px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}
.timer{font-size:54px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums}
.warn{background:var(--warnbg);border:1px solid var(--a);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;color:var(--onc)}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--g),var(--b))}
.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px;margin-inline-end:8px}.badge.off{opacity:.4}
.app[hidden],#auth[hidden]{display:none}
#nav{display:flex;flex-direction:column;gap:4px}
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow:auto;z-index:50;background:radial-gradient(900px 420px at 50% -10%,color-mix(in srgb,var(--navon) 20%,transparent),transparent),radial-gradient(700px 400px at 100% 100%,color-mix(in srgb,var(--a) 14%,transparent),transparent),linear-gradient(160deg,var(--bg),var(--bg2))}
.authbox{width:100%;max-width:420px}
.authhead{text-align:center;margin-bottom:16px;background:var(--nav);border-radius:22px;padding:22px 16px 18px;box-shadow:0 12px 34px #0005}.authhead img{width:240px;max-width:70%;height:auto}
.authhead h1{margin:10px 0 0;font-size:32px;font-weight:800;color:#fff}.authhead p{margin:2px 0 0;color:var(--navtx)}
.note{margin-top:14px;text-align:center}
.warn.err{background:color-mix(in srgb,var(--r) 14%,transparent);border-color:var(--r)}.warn.ok{background:color-mix(in srgb,var(--g) 14%,transparent);border-color:var(--g)}
.av{width:36px;height:36px;border-radius:50%;background:var(--navon);color:var(--navonink);display:inline-grid;place-items:center;font-size:18px;flex:none}
.nv .av{width:36px;height:36px}.av.lg{width:64px;height:64px;font-size:32px}
.me{margin-bottom:10px}
.qo{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:5px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink);font-size:14px}
.qo b{font-size:19px;width:22px;text-align:center}.qo input{margin:0}.qo span{display:flex;flex-direction:column;line-height:1.35}.qo small{color:var(--mut);font-size:12px}.qo:has(input:checked){border-color:var(--g);box-shadow:0 0 0 2px var(--g) inset}
.pill:disabled{opacity:.45;cursor:not-allowed}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.nv span{display:inline-flex;align-items:center;justify-content:center}.nv .ico{width:20px;height:20px;vertical-align:middle}
.av .ico{width:58%;height:58%;vertical-align:middle}.badge .ico{width:18px;height:18px;color:var(--g)}
.pill .ico{width:18px;height:18px;vertical-align:-.3em}h2.t .ico{color:var(--g);width:.85em;height:.85em;vertical-align:-.1em}
.tag .ico,.btn .ico{width:13px;height:13px;vertical-align:-.15em}.warn .ico{color:var(--g);vertical-align:-.25em}#t-rtp .ico{color:var(--g)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0;padding-bottom:2px}.tabs .pill{white-space:nowrap}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:12px;color:var(--mut);text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr.done td b{text-decoration:line-through;opacity:.6}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin-top:10px}.wd{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}.wd h4{margin:0 0 6px;font-size:13px}.wd.today{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
.wi{font-size:12px;border-radius:8px;padding:5px 7px;margin-bottom:5px;background:var(--card);border-inline-start:3px solid var(--a)}.wi.ex{border-inline-start-color:var(--r)}.wi b{display:block;font-size:12px}.wi small{color:var(--mut)}.wi.ok{opacity:.55;text-decoration:line-through}
details{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:700}.tl{margin:8px 0 0;padding-inline-start:20px;line-height:1.8}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.pal{font:inherit;cursor:pointer;background:var(--in);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:start;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.pal.on{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}.pal .sw{display:flex;height:34px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1px #0002}.pal .sw i{flex:1}.pal b{font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}.pal .ico{color:var(--g)}
.sec{font-size:19px;font-weight:800;margin:28px 0 12px}
/* large desktop */
@media(min-width:1500px){main{max-width:1280px;padding:36px}}
/* small laptop / tablet landscape */
@media(min-width:1024px) and (max-width:1199px){aside{width:220px}main{padding:24px}}
/* tablet: slim icon rail */
@media(min-width:641px) and (max-width:1023px){
 aside{width:78px;padding:14px 8px;align-items:center}

 aside .nv{justify-content:center;padding:12px 0;width:54px}aside .nv span{width:auto;font-size:20px}
 main{padding:22px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}
}
@media(min-width:641px) and (max-width:760px){.g2{grid-template-columns:1fr}}
/* phone: top bar + bottom tab bar */
@media(max-width:640px){
 .app{flex-direction:column}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:6;background:var(--nav);color:#fff;padding:8px 14px}
 .mtop img{width:42px;height:auto}.mtop b{font-size:21px;font-weight:800}.mtop span{margin-inline-start:auto;font-size:14px;color:var(--navtx)}
 aside{position:fixed;inset:auto 0 0 0;top:auto;width:100%;height:auto;flex-direction:row;align-items:center;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible;z-index:20;box-shadow:0 -2px 14px #0004}
 aside .brand,aside .me,.foot,aside .nv .lbl{display:none}
 #nav{flex-direction:row;flex:1;justify-content:space-around;gap:0}
 aside .nv .ico{width:23px;height:23px}
 aside .nv{width:auto;flex:1;min-width:0;justify-content:center;padding:11px 0}aside .nv span{width:auto;font-size:21px}
 aside>.nv{flex:0 0 44px}
 main{padding:16px 14px calc(86px + env(safe-area-inset-bottom,0px))}
 h2.t{font-size:23px}.kv{font-size:26px}.timer{font-size:44px}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g2{grid-template-columns:1fr}
 input,select,textarea{font-size:16px}
 .card{padding:14px}.row>*{min-width:96px}
 .authhead img{width:150px}
}
@media(max-width:360px){.g4{grid-template-columns:1fr}.kv{font-size:24px}}
/* touch devices: comfortable targets */
@media(max-width:640px){.tbl thead{display:none}.tbl tr{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}.tbl td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:4px 0}.tbl td::before{content:attr(data-l);color:var(--mut);font-size:12px}.tbl td[data-l=""]::before{content:none}}
@media(pointer:coarse){button.btn{min-height:44px}button.btn.s{min-height:34px;padding:4px 12px}.pill{padding:8px 16px}input,select{min-height:42px}}
/* short landscape phones */
@media(max-height:480px) and (orientation:landscape) and (max-width:900px){.mtop{display:none}main{padding-top:12px}}
</style></head>

const hsl2hex=(h,s,l)=>{h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')};
const lumHex=h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(x=>x<=.03928?x/12.92:((x+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const crHex=(a,b)=>{const x=lumHex(a),y=lumHex(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const fit=(h,s,l,against,min,dir)=>{let c=hsl2hex(h,s,l);for(let i=0;i<70&&crHex(c,against)<min;i++){l+=dir;c=hsl2hex(h,s,l)}return c};
